apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  labels:
    app: aceest-fitness
    strategy: canary
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: canary
        track: stable
    spec:
      containers:
        - name: aceest-fitness
          image: STABLE_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  labels:
    app: aceest-fitness
    strategy: canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: canary
        track: canary
    spec:
      containers:
        - name: aceest-fitness
          image: CANARY_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  labels:
    app: aceest-fitness
    strategy: canary
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    strategy: canary
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30082
