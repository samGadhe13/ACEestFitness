apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest-fitness
    strategy: bluegreen
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: bluegreen
      version: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: bluegreen
        version: blue
    spec:
      containers:
        - name: aceest-fitness
          image: BLUE_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app: aceest-fitness
    strategy: bluegreen
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: bluegreen
      version: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: bluegreen
        version: green
    spec:
      containers:
        - name: aceest-fitness
          image: GREEN_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-service
  labels:
    app: aceest-fitness
    strategy: bluegreen
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    strategy: bluegreen
    version: blue
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30081
