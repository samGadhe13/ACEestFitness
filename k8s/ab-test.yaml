apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-a
  labels:
    app: aceest-fitness
    strategy: ab
    version: a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: ab
      version: a
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: ab
        version: a
    spec:
      containers:
        - name: aceest-fitness
          image: A_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-b
  labels:
    app: aceest-fitness
    strategy: ab
    version: b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: ab
      version: b
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: ab
        version: b
    spec:
      containers:
        - name: aceest-fitness
          image: B_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a-service
  labels:
    app: aceest-fitness
    strategy: ab
    version: a
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    strategy: ab
    version: a
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b-service
  labels:
    app: aceest-fitness
    strategy: ab
    version: b
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    strategy: ab
    version: b
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30084
