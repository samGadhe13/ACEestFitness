apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  labels:
    app: aceest-fitness
    strategy: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: shadow
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: shadow
        track: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: SHADOW_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
  labels:
    app: aceest-fitness
    strategy: shadow
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    strategy: shadow
    track: shadow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
